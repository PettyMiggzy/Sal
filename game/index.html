<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="Shrimp to Whale — a 3D Salmonad game. Eat smaller fish, dodge the MONAD whales, and flip from shrimp to whale.">
<style>
  :root{
    --purple:#836EF9; --violet:#8B5CF6; --violet-b:#A78BFA;
    --orange:#F0932B; --foam:#EAE6FF; --muted:#9E97C8; --good:#4ADE80; --bad:#F87171;
    --poster:Impact,"Haettenschweiler","Arial Narrow Bold",sans-serif;
    --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#05060f;font-family:var(--body);color:var(--foam);
    user-select:none;-webkit-user-select:none;touch-action:none}
  #c{display:block;width:100vw;height:100vh}
  .poster{font-family:var(--poster);text-transform:uppercase;letter-spacing:.02em}

  /* HUD */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  .tl{position:absolute;top:16px;left:18px}
  .tr{position:absolute;top:16px;right:18px;text-align:right}
  #sizeN{font-family:var(--poster);font-size:40px;line-height:.9;color:var(--foam);
    text-shadow:0 2px 12px rgba(0,0,0,.6)}
  #tier{font-family:var(--poster);text-transform:uppercase;font-size:16px;color:var(--orange);letter-spacing:.1em}
  .lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  #bestN{font-family:var(--poster);font-size:22px;color:var(--violet-b)}
  /* growth bar */
  #barWrap{position:absolute;left:18px;right:18px;bottom:18px;height:10px;border-radius:6px;
    background:rgba(255,255,255,.10);overflow:hidden;border:1px solid rgba(131,110,249,.35)}
  #bar{height:100%;width:0%;background:linear-gradient(90deg,var(--purple),var(--orange));transition:width .18s}
  #depth{position:absolute;bottom:34px;left:18px;font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
  #warn{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);font-family:var(--poster);
    font-size:clamp(34px,8vw,72px);color:var(--bad);opacity:0;text-shadow:0 0 30px rgba(248,113,113,.6);
    transition:opacity .15s}
  /* aim reticle + markers */
  #centerMark{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);
    opacity:.45;pointer-events:none}
  #centerMark::before,#centerMark::after{content:"";position:absolute;background:rgba(234,230,255,.7)}
  #centerMark::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
  #centerMark::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}
  #reticle{position:absolute;left:50%;top:50%;width:60px;height:60px;transform:translate(-50%,-50%);
    border:2.5px solid rgba(240,147,43,.95);border-radius:50%;opacity:0;pointer-events:none;
    box-shadow:0 0 16px rgba(240,147,43,.55),inset 0 0 10px rgba(240,147,43,.3);transition:opacity .18s}
  #reticle span{position:absolute;left:50%;top:50%;width:16px;height:2.5px;background:rgba(240,147,43,.95);border-radius:2px}
  #reticle span:nth-child(1){transform:translate(-50%,-50%) rotate(45deg)}
  #reticle span:nth-child(2){transform:translate(-50%,-50%) rotate(-45deg)}
  #lockRing{position:absolute;left:50%;top:50%;width:70px;height:70px;transform:translate(-50%,-50%);
    border:3px solid var(--good);border-radius:14px;opacity:0;pointer-events:none;
    box-shadow:0 0 20px rgba(74,222,128,.6);transition:opacity .12s}
  #lockRing.threat{border-color:var(--bad);box-shadow:0 0 20px rgba(248,113,113,.6)}
  #dashBtn{position:fixed;right:22px;bottom:64px;width:96px;height:96px;border-radius:50%;z-index:12;
    background:radial-gradient(circle at 50% 40%,rgba(240,147,43,.95),rgba(232,135,58,.75));
    border:2px solid rgba(255,255,255,.45);color:#241207;font-family:var(--poster);font-size:22px;
    letter-spacing:.05em;pointer-events:auto;touch-action:none;box-shadow:0 10px 26px rgba(240,147,43,.5)}
  #dashBtn:active{transform:scale(.92)}

  /* panels */
  .screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(80% 80% at 50% 30%,rgba(20,18,45,.6),rgba(5,6,15,.92));
    backdrop-filter:blur(3px);pointer-events:auto}
  .card{max-width:440px;width:88%;text-align:center;padding:34px 28px;border-radius:22px;
    background:linear-gradient(180deg,rgba(27,23,64,.92),rgba(11,10,26,.92));
    border:1px solid rgba(131,110,249,.35);box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .card h1{font-family:var(--poster);text-transform:uppercase;font-size:clamp(30px,6vw,46px);line-height:.95;text-wrap:balance;
    background:linear-gradient(120deg,var(--violet-b),var(--purple) 55%,var(--orange));
    -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
  .card .sub{color:var(--muted);font-size:15px;margin-bottom:20px;line-height:1.5}
  .card .sub b{color:var(--foam)}
  .btn{font-family:var(--poster);text-transform:uppercase;letter-spacing:.05em;cursor:pointer;border:none;
    padding:15px 30px;border-radius:13px;font-size:20px;color:#241207;
    background:linear-gradient(120deg,var(--orange),#E8873A);box-shadow:0 10px 26px rgba(240,147,43,.4);
    transition:transform .12s}
  .btn:hover{transform:translateY(-2px)}
  .btn.ghost{background:rgba(131,110,249,.16);color:var(--foam);border:1px solid rgba(131,110,249,.4);
    box-shadow:none;font-size:15px;padding:12px 22px}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .stat{display:flex;gap:22px;justify-content:center;margin:14px 0 4px}
  .stat div{font-family:var(--poster);font-size:30px}
  .stat span{display:block;font-family:var(--body);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
  .lb{margin:14px auto 2px;max-width:300px;text-align:left}
  .lb .lbtitle{font-family:var(--poster);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--muted2,var(--muted));margin-bottom:6px;text-align:center}
  .lb .lbrow{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:5px 12px;border-radius:8px;color:var(--muted)}
  .lb .lbrow .r{font-family:var(--poster);color:var(--violet-b);width:22px;text-align:right}
  .lb .lbrow .s{font-family:var(--poster);color:var(--foam);margin-left:auto}
  .lb .lbrow.me{background:rgba(240,147,43,.16);color:var(--foam)}
  .lb .lbrow.me .r{color:var(--orange,#f0932b)}
  #gnav{position:fixed;top:12px;right:12px;display:flex;gap:8px;z-index:40}
  .gbtn{display:inline-flex;align-items:center;gap:6px;font-family:var(--poster);text-transform:uppercase;letter-spacing:.06em;
    font-size:13px;color:var(--foam);text-decoration:none;cursor:pointer;line-height:1;
    background:rgba(20,16,40,.55);border:1px solid rgba(167,139,250,.4);border-radius:12px;padding:9px 13px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .gbtn:hover{background:rgba(131,110,249,.32);border-color:var(--violet-b)}
  .gbtn span{font-family:var(--body);font-weight:700}
  @media(max-width:520px){.gbtn span{display:none}.gbtn{padding:10px 12px;font-size:17px}}
  .hint{font-size:12.5px;color:var(--muted);margin-top:16px;line-height:1.6}
  .hint kbd{font-family:var(--poster);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
    border-radius:5px;padding:1px 7px;font-size:12px}
  /* ---- title screen ---- */
  #start.title{background:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0;overflow:hidden}
  #titleBg{position:absolute;inset:0;z-index:0;background:#0e3358 center/cover no-repeat}
  #titleBg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,20,40,.28),rgba(6,16,34,.05) 30%,rgba(6,16,34,.34))}
  #titleWrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    width:100%;height:100%;padding:4vh 18px;box-sizing:border-box;text-align:center;overflow-y:auto}
  .gtitle{font-family:var(--poster);line-height:.8;filter:drop-shadow(0 5px 0 rgba(0,0,0,.22))}
  .gtitle span{display:block;-webkit-text-stroke:3px #fff;paint-order:stroke fill;letter-spacing:.01em}
  .gtitle .l1{font-size:clamp(44px,12.5vmin,116px);background:linear-gradient(180deg,#FFDA7A,#F0932B 58%,#DE7C22);-webkit-background-clip:text;background-clip:text;color:transparent}
  .gtitle .l2{font-size:clamp(38px,10.5vmin,100px);margin-top:-.05em;background:linear-gradient(180deg,#9bd6ff,#3d7fe0 60%,#295cad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .gsub{font-family:"Brush Script MT","Segoe Script",cursive;font-size:clamp(22px,5.4vmin,46px);color:#FFCB4F;
    -webkit-text-stroke:1.4px #6b4a12;paint-order:stroke fill;margin-top:4px;transform:rotate(-3deg)}
  #mascot{width:clamp(140px,29vmin,290px);height:auto;margin:1.6vh 0 .4vh;filter:drop-shadow(0 12px 14px rgba(0,0,0,.4));animation:bob 3.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-2.5deg)}50%{transform:translateY(-15px) rotate(2.5deg)}}
  #menu{display:flex;flex-direction:column;gap:13px;width:min(340px,82vw);margin-top:1vh}
  .wbtn{position:relative;display:block;text-decoration:none;text-align:center;cursor:pointer;border:none;
    font-family:var(--poster);text-transform:uppercase;letter-spacing:.04em;font-size:clamp(19px,3.6vmin,26px);
    color:#fff;padding:15px 20px;border-radius:15px;
    background:linear-gradient(180deg,#BE7E42,#8a5522);border-top:3px solid #dda866;
    box-shadow:0 7px 0 #593716,0 12px 20px rgba(0,0,0,.4);text-shadow:0 2px 0 rgba(0,0,0,.32);
    transition:transform .09s,box-shadow .09s}
  .wbtn:hover{transform:translateY(-2px);box-shadow:0 9px 0 #593716,0 16px 24px rgba(0,0,0,.46)}
  .wbtn:active{transform:translateY(5px);box-shadow:0 2px 0 #593716,0 5px 10px rgba(0,0,0,.4)}
  .wbtn.play{background:linear-gradient(180deg,#5ec06e,#2f8f42);border-top-color:#93e79d;box-shadow:0 7px 0 #175021,0 12px 20px rgba(0,0,0,.4)}
  .wbtn.play:hover{box-shadow:0 9px 0 #175021,0 16px 24px rgba(0,0,0,.46)}
  .wbtn.play:active{box-shadow:0 2px 0 #175021,0 5px 10px rgba(0,0,0,.4)}
  .ttlhint{color:#e6efff;font-size:12.5px;line-height:1.5;margin-top:6px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
  .hidden{display:none!important}
  a.link{color:var(--violet-b);text-decoration:none}
</style>
</head>

<script src="/game/three.min.js"></script>
<script>
(function(){
"use strict";
if(!window.THREE){document.getElementById('start').innerHTML='<div class="card"><h1>Oops</h1><div class="sub">3D engine failed to load. Refresh?</div></div>';return;}
var T=THREE;

/* ---------- renderer / scene ---------- */
var canvas=document.getElementById('c');
var renderer=new T.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setClearColor(0x0a1a3a,1);
var scene=new T.Scene();
var SHALLOW=new T.Color(0x2a86c8), DEEP=new T.Color(0x070826);
scene.fog=new T.FogExp2(0x123a6a,0.008);
var camera=new T.PerspectiveCamera(62,1,0.1,600);
camera.position.set(0,4,16);

/* lights */
var hemi=new T.HemisphereLight(0xbfe0ff,0x14204a,1.05); scene.add(hemi);
var sun=new T.DirectionalLight(0xfff4e0,0.9); sun.position.set(6,20,4); scene.add(sun);
var amb=new T.AmbientLight(0x4060a0,0.5); scene.add(amb);

/* god-ray-ish light shafts (big translucent planes) */
var shafts=new T.Group();
for(var i=0;i<5;i++){
  var g=new T.PlaneGeometry(6,120);
  var m=new T.MeshBasicMaterial({color:0x9fc8ff,transparent:true,opacity:0.05,depthWrite:false,side:T.DoubleSide});
  var p=new T.Mesh(g,m); p.position.set(-30+i*15,10,-40-i*8); p.rotation.z=0.25; shafts.add(p);
}
scene.add(shafts);

/* seabed */
var seabed=new T.Mesh(new T.PlaneGeometry(1200,1200,1,1),
  new T.MeshStandardMaterial({color:0x1c1740,roughness:1}));
seabed.rotation.x=-Math.PI/2; seabed.position.y=-70; scene.add(seabed);
for(var r=0;r<70;r++){
  var rock=new T.Mesh(new T.ConeGeometry(2+Math.random()*7,4+Math.random()*14,5),
    new T.MeshStandardMaterial({color:new T.Color().setHSL(0.72,0.4,0.14+Math.random()*0.1),roughness:1,flatShading:true}));
  rock.position.set((Math.random()-.5)*700,-70+2,(Math.random()-.5)*700); scene.add(rock);
}
/* corals for color */
for(var cc=0;cc<48;cc++){
  var col=new T.Color().setHSL(Math.random(),0.7,0.55);
  var coral=new T.Mesh(new T.IcosahedronGeometry(1.6+Math.random()*3,0),
    new T.MeshStandardMaterial({color:col,roughness:.8,flatShading:true}));
  coral.position.set((Math.random()-.5)*620,-68+Math.random()*3,(Math.random()-.5)*620); scene.add(coral);
}
/* tall coral towers rising into the swim zone */
for(var tw=0;tw<30;tw++){
  var th=22+Math.random()*44;
  var tower=new T.Mesh(new T.ConeGeometry(2.2+Math.random()*3.5,th,6),
    new T.MeshStandardMaterial({color:new T.Color().setHSL(Math.random(),0.65,0.5),roughness:.85,flatShading:true}));
  tower.position.set((Math.random()-.5)*640,-72+th/2,(Math.random()-.5)*640); scene.add(tower);
}
/* swaying kelp strands */
var kelps=[];
for(var kk=0;kk<46;kk++){
  var kh=26+Math.random()*40;
  var kelp=new T.Mesh(new T.CylinderGeometry(0.18,0.5,kh,5),
    new T.MeshStandardMaterial({color:new T.Color().setHSL(0.3+Math.random()*0.12,0.6,0.32+Math.random()*0.12),roughness:1,flatShading:true}));
  kelp.position.set((Math.random()-.5)*620,-72+kh/2,(Math.random()-.5)*620);
  kelp.userData.ph=Math.random()*6.28; kelp.userData.base=kelp.rotation.z; scene.add(kelp); kelps.push(kelp);
}

/* bubbles / motes */
var moteN=600, mpos=new Float32Array(moteN*3);
for(var b=0;b<moteN;b++){mpos[b*3]=(Math.random()-.5)*300;mpos[b*3+1]=(Math.random()-.5)*160;mpos[b*3+2]=(Math.random()-.5)*300;}
var mg=new T.BufferGeometry(); mg.setAttribute('position',new T.BufferAttribute(mpos,3));
var motes=new T.Points(mg,new T.PointsMaterial({color:0xbfe0ff,size:0.5,transparent:true,opacity:0.5,depthWrite:false}));
scene.add(motes);

/* ---------- fish builders ---------- */
function eye(x,y,z,r){
  r=r||0.44; var g=new T.Group();
  var w=new T.Mesh(new T.SphereGeometry(r,18,16),new T.MeshStandardMaterial({color:0xfff8f0,roughness:.32}));
  var pu=new T.Mesh(new T.SphereGeometry(r*0.5,12,12),new T.MeshStandardMaterial({color:0x111111,roughness:.22}));
  pu.position.set(0,0.05,r*0.8); g.add(w); g.add(pu); g.position.set(x,y,z); return g;
}
// tapered fish body of revolution — a real spindle, nose at +Z, tail at -Z
function fishBody(mat,len,girth,headBias){
  headBias=headBias||1.0;
  var prof=[[0.02,-1.00],[0.11,-0.85],[0.22,-0.64],[0.35,-0.40],[0.45,-0.13],[0.50,0.15],[0.48*headBias,0.44],[0.36*headBias,0.68],[0.18*headBias,0.87],[0.03,1.00]];
  var pts=prof.map(function(p){return new T.Vector2(Math.max(0.002,p[0]*girth),p[1]*len*0.5);});
  var g=new T.LatheGeometry(pts,22); g.rotateX(Math.PI/2);
  return new T.Mesh(g,mat);
}
// flat forked caudal (tail) fin — the signature fish silhouette. broad side faces X, sweeps back -Z
function caudalFin(mat,size,spread){
  size=size||1; spread=spread||0.75;
  var s=new T.Shape(); s.moveTo(0,0); s.lineTo(-0.9,spread); s.lineTo(-0.52,0); s.lineTo(-0.9,-spread); s.closePath();
  var g=new T.ShapeGeometry(s); g.rotateY(-Math.PI/2);
  var m=new T.Mesh(g,mat); m.scale.setScalar(size); return m;
}
// flat triangular fin (dorsal / pectoral) in XY plane, apex up +Y, sweeps back -X
function triFin(mat,w,h){
  var s=new T.Shape(); s.moveTo(0,0); s.lineTo(-w,0.02); s.lineTo(-w*0.18,h); s.closePath();
  var g=new T.ShapeGeometry(s); return new T.Mesh(g,mat);
}
// The player: stylized Salmonad — purple body, brown fins/lips, spiky dorsal

/* ---------- game state ---------- */
var player=makeSalmonad(); scene.add(player);

// input

var touchDevice=false, steerHeld=false, mouseHeld=false, spaceHeld=false, dashBtnHeld=false;

function playerRadius(){return Math.cbrt(mass)*1.1;}
function playerScale(){return Math.cbrt(mass);}

var TIERS=[[1,'Shrimp'],[3,'Fry'],[8,'Minnow'],[20,'Lil Fish'],[50,'Fish'],[120,'Big Fish'],[300,'Hunter'],[750,'Apex'],[1600,'Kraken'],[3500,'WHALE 🐋']];
function tierName(m){var n=TIERS[0][1];for(var i=0;i<TIERS.length;i++){if(m>=TIERS[i][0])n=TIERS[i][1];}return n;}
function nextTierMass(m){for(var i=0;i<TIERS.length;i++){if(m<TIERS[i][0])return TIERS[i][0];}return TIERS[TIERS.length-1][0];}
function prevTierMass(m){var p=1;for(var i=0;i<TIERS.length;i++){if(m>=TIERS[i][0])p=TIERS[i][0];}return p;}

/* spawn one npc relative to player size */
var FISH_COLORS=[0xff7043,0xffca28,0x26c6da,0xef5350,0x66bb6a,0xffa726,0xec407a,0x42a5f5,0xab47bc];
function spawnNpc(far){
  var f, size, m, kind='fish';
  var roll=Math.random();
  if(roll<0.74){ // food — scales to you
    f=makeFish(FISH_COLORS[(Math.random()*FISH_COLORS.length)|0]); m=mass*(0.12+Math.random()*0.55); size=Math.cbrt(m)*1.05;
  } else if(roll<0.93){ // near size
    f=makeFish(FISH_COLORS[(Math.random()*FISH_COLORS.length)|0]); m=mass*(0.6+Math.random()*0.7); size=Math.cbrt(m)*1.05;
  } else if(roll<0.975){ // SHARK — rare threat, size varies (capped so it's not a blob)
    kind='shark'; f=makeShark(); m=Math.min(45, Math.max(mass*1.05, 4+Math.random()*Math.random()*18)); size=Math.cbrt(m)*1.05;
  } else { // WHALE — very rare giant (capped)
    kind='whale'; f=makeWhale(); m=Math.min(110, Math.max(mass*1.25, 12+Math.random()*Math.random()*55)); size=Math.cbrt(m)*1.1;
  }
  f.scale.setScalar(size);
  var big=(kind!=='fish');
  var dir=new T.Vector3(Math.random()-.5,(Math.random()-.5)*0.5,Math.random()-.5).normalize();
  var dist=(far?70:35)+Math.random()*(big?95:60);
  f.position.copy(player.position).addScaledVector(dir,dist);
  f.position.y=Math.max(-60,Math.min(28,f.position.y));
  var vel=new T.Vector3((Math.random()-.5),(Math.random()-.5)*0.35,(Math.random()-.5)).normalize().multiplyScalar((big?1.4:2)+Math.random()*(big?2:3));
  var o={mesh:f,mass:m,size:size,vel:vel,whale:kind==='whale',shark:kind==='shark',kind:kind,wig:Math.random()*10};
  npcs.push(o); scene.add(f);
  return o;
}
function clearNpcs(){for(var i=0;i<npcs.length;i++)scene.remove(npcs[i].mesh);npcs=[];}

/* ---------- input ---------- */
// desktop: mouse steers (always), hold button / Space dashes

canvas.addEventListener('mousedown',function(){mouseHeld=true;});

window.addEventListener('keyup',function(e){if(e.code==='Space')spaceHeld=false;});
// touch: drag anywhere on canvas to steer, release to go straight; DASH button dashes
function tset(e){var t=e.touches[0];if(t){scr.rx=t.clientX;scr.ry=t.clientY;}}
canvas.addEventListener('touchstart',function(e){touchDevice=true;steerHeld=true;tset(e);},{passive:true});

// dash button (touch + mouse)
var dashBtnEl=el('dashBtn');

function dbOff(){dashBtnHeld=false;}
dashBtnEl.addEventListener('touchstart',dbOn,{passive:false});

dashBtnEl.addEventListener('touchcancel',dbOff);

window.addEventListener('touchstart',function(){touchDevice=true;},{passive:true,capture:true});
function DZ(v){var s=v<0?-1:1,a=Math.abs(v);a=(a-0.10)/0.90;if(a<0)a=0;return s*a*(0.4+0.6*a);}

/* eat particles */
var pooForce=[];
function pop(pos,color,n){
  for(var i=0;i<n;i++){
    var m=new T.Mesh(new T.SphereGeometry(0.3,6,6),new T.MeshBasicMaterial({color:color}));
    m.position.copy(pos);
    var v=new T.Vector3((Math.random()-.5),(Math.random()-.5),(Math.random()-.5)).multiplyScalar(6+Math.random()*8);
    m.userData.v=v; m.userData.life=0.7; scene.add(m); pooForce.push(m);
  }
}

/* ---------- loop ---------- */
var clock=new T.Clock();
function frame(){
  requestAnimationFrame(frame);
  var dt=Math.min(clock.getDelta(),0.05);
  motes.rotation.y+=dt*0.01;
  for(var ks=0;ks<kelps.length;ks++){kelps[ks].rotation.z=Math.sin(clock.elapsedTime*0.6+kelps[ks].userData.ph)*0.12;}
  // depth color grade
  var depthT=Math.max(0,Math.min(1,(-player.position.y+10)/70));
  scene.fog.color.copy(SHALLOW).lerp(DEEP,depthT); renderer.setClearColor(scene.fog.color,1);
  hemi.intensity=1.05-0.5*depthT;

  if(paused){ /* frozen while a modal is open */ }
  else if(running){
    gameTime+=dt;
    if(invuln>0){invuln-=dt; player.visible=(Math.floor(gameTime*12)%2===0);} else player.visible=true;
    // steering: reticle offset -> target yaw/pitch (deadzone + auto-level)
    var iw=window.innerWidth, ih=window.innerHeight, ccx=iw/2, ccy=ih/2;
    var aiming = touchDevice ? steerHeld : true;
    var nx=(scr.rx-ccx)/ccx, ny=(scr.ry-ccy)/ccy;
    var sx=aiming?DZ(nx):0, sy=aiming?DZ(ny):0;
    targYaw   -= sx*dt*2.7;
    targPitch -= sy*dt*2.05;
    targPitch += (-targPitch)*dt*0.5;               // gentle auto-level toward flat
    targPitch=Math.max(-1.05,Math.min(1.05,targPitch));

    // aim assist: nearest edible fish near the reticle -> magnetism + lock ring
    var lockObj=null, lockPx=null, lockThreat=false, bestScore=1e9;
    for(var ai=0;ai<npcs.length;ai++){
      var oo=npcs[ai];
      var sp=oo.mesh.position.clone().project(camera);
      if(sp.z>1) continue;                            // behind camera
      var px=(sp.x*0.5+0.5)*iw, py=(-sp.y*0.5+0.5)*ih;
      var dd=Math.hypot(px-scr.rx,py-scr.ry);
      if(dd<150 && dd<bestScore){bestScore=dd;lockObj=oo;lockPx=[px,py];lockThreat=!(oo.mass<mass*0.92);}
    }
    if(lockObj && !lockThreat){
      var toT=lockObj.mesh.position.clone().sub(player.position).normalize();
      var tYaw=Math.atan2(toT.x,toT.z), tPitch=Math.asin(Math.max(-1,Math.min(1,toT.y)));
      var k=Math.min(1,dt*3.0)*(1-bestScore/150)*0.9;
      targYaw   += Math.atan2(Math.sin(tYaw-targYaw),Math.cos(tYaw-targYaw))*k;
      targPitch += (tPitch-targPitch)*k;
    }

    yaw   += (targYaw-yaw)*Math.min(1,dt*9);
    pitch += (targPitch-pitch)*Math.min(1,dt*9);
    var dir=new T.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch));
    dashing = spaceHeld||dashBtnHeld||(mouseHeld&&!touchDevice);

    // reticle + lock DOM
    var ret=el('reticle');
    ret.style.opacity=aiming?'1':'0'; ret.style.left=scr.rx+'px'; ret.style.top=scr.ry+'px';
    var lr=el('lockRing');
    if(lockObj && bestScore<150){
      var dist=camera.position.distanceTo(lockObj.mesh.position);
      var sz=Math.max(44,Math.min(130,2200*lockObj.size/dist));
      lr.style.opacity='1'; lr.style.left=lockPx[0]+'px'; lr.style.top=lockPx[1]+'px';
      lr.style.width=sz+'px'; lr.style.height=sz+'px'; lr.classList.toggle('threat',lockThreat);
    } else lr.style.opacity='0';
    if(touchDevice) el('dashBtn').classList.remove('hidden');
    var baseSpd=14+Math.min(mass*0.04,10);
    var spd=baseSpd*(dashing?1.9:1);
    player.position.addScaledVector(dir,spd*dt);

    // bounds: keep near origin-ish (soft) and within vertical band
    if(player.position.y>28){player.position.y=28;targPitch=Math.min(targPitch,-0.1);}
    if(player.position.y<-62){player.position.y=-62;targPitch=Math.max(targPitch,0.1);}
    var horiz=Math.hypot(player.position.x,player.position.z);
    if(horiz>WORLD){ // steer back toward center
      var toC=Math.atan2(-player.position.x,-player.position.z);
      targYaw += (Math.atan2(Math.sin(toC-yaw),Math.cos(toC-yaw)))*dt*1.5;
    }

    // orient player
    player.scale.setScalar(playerScale());
    var look=player.position.clone().add(dir);
    player.lookAt(look);
    // tail wiggle
    if(player.userData.tail) player.userData.tail.rotation.y=Math.sin(gameTime*(dashing?18:9))*0.4;

    // camera: dorsal 3/4 chase (behind & above so you see the fish)
    var back=dir.clone().multiplyScalar(-(8.5+playerRadius()*3.0));
    var camTarget=player.position.clone().add(back); camTarget.y+=5.5+playerRadius()*2.2;
    camera.position.lerp(camTarget,Math.min(1,dt*4));
    camera.lookAt(player.position.x, player.position.y-0.6, player.position.z+dir.z*3);
    camera.fov += ((dashing?70:62)-camera.fov)*Math.min(1,dt*5); camera.updateProjectionMatrix();

    // maintain population
    while(npcs.length<MAXN) spawnNpc(true);

    // fishing hooks: hit = yanked back to original size; hit while original = caught
    while(hooks.length<MAXHOOK) spawnHook();
    var prH=playerRadius();
    for(var hi=hooks.length-1;hi>=0;hi--){
      var hk=hooks[hi]; hk.userData.bob+=dt;
      hk.position.y=hk.userData.baseY+Math.sin(hk.userData.bob*1.3)*1.6;
      var baitPos=new T.Vector3(hk.position.x,hk.position.y+hk.userData.baitY,hk.position.z);
      var hd=baitPos.distanceTo(player.position);
      if(hd>170){scene.remove(hk);hooks.splice(hi,1);continue;}
      if(invuln<=0 && hd < prH+0.5){
        if(mass>1.8){ mass=1; invuln=1.8; pop(baitPos,0xffffff,16); flashWarn('SNAPPED! back to shrimp',0xF87171); scene.remove(hk); hooks.splice(hi,1); updHud(); }
        else { gameOver('hook'); return; }
      }
    }

    // fishnets drifting in the shallows — too high = caught
    while(nets.length<MAXNET) spawnNet();
    for(var ni=nets.length-1;ni>=0;ni--){
      var nt=nets[ni]; nt.position.addScaledVector(nt.userData.vel,dt);
      var fx=player.position.x-nt.position.x, fz=player.position.z-nt.position.z;
      if(Math.hypot(fx,fz)>170){scene.remove(nt);nets.splice(ni,1);continue;}
      if(invuln<=0 && Math.abs(player.position.y-nt.position.y)<2.4 && Math.abs(fx)<nt.userData.half && Math.abs(fz)<nt.userData.half){
        if(mass>1.8){ mass=1; invuln=1.8; player.position.y-=5; targPitch=Math.max(targPitch,0.35); pop(player.position.clone(),0xffffff,16); flashWarn('NET! dive deeper',0xF87171); updHud(); }
        else { gameOver('net'); return; }
      }
    }

    // test hook (?test=1): nudge a small fish in front to verify eating
    if(TESTMODE){testT+=dt; if(testT>0.4){testT=0; for(var ti=0;ti<npcs.length;ti++){if(npcs[ti].mass<mass*0.8){npcs[ti].mesh.position.copy(player.position).addScaledVector(dir,playerRadius()*0.3);break;}}}}

    // update npcs
    var pr=playerRadius();
    var danger=false;
    for(var i=npcs.length-1;i>=0;i--){
      var o=npcs[i]; o.wig+=dt;
      // wander
      o.mesh.position.addScaledVector(o.vel,dt);
      if(Math.random()<0.01){o.vel.x+=(Math.random()-.5);o.vel.z+=(Math.random()-.5);o.vel.clampLength(1,5);}
      o.mesh.position.y=Math.max(-64,Math.min(28,o.mesh.position.y));
      // face motion
      var mv=o.vel.clone().normalize();
      o.mesh.lookAt(o.mesh.position.clone().add(mv));
      if(o.mesh.userData.tail)o.mesh.userData.tail.rotation.y=Math.sin(o.wig*8)*0.4;
      // flee only once you're a mid-size fish (early game stays easy)
      var d=o.mesh.position.distanceTo(player.position);
      if(o.mass<mass*0.9 && d<pr+o.size+9 && mass>14){
        var away=o.mesh.position.clone().sub(player.position).normalize();
        o.vel.addScaledVector(away,dt*8).clampLength(1,6);
      }
      // recycle if far (big roamers persist longer so giants stay visible)
      if(d>(o.kind!=='fish'?210:150)){scene.remove(o.mesh);npcs.splice(i,1);continue;}
      // collision — tight, proportional grace so eating feels accurate (not a vacuum)
      var hit=pr+o.size+Math.min(0.5,pr*0.18);
      if(d < hit){
        if(o.mass < mass*0.92){
          // eat
          mass+=o.mass*0.55;
          var pc=o.whale?0x8fb8f0:(o.shark?0x9aa7b8:o.mesh.children[0].material.color.getHex());
          pop(o.mesh.position,pc,o.kind!=='fish'?24:10);
          scene.remove(o.mesh); npcs.splice(i,1);
          updHud();
          if(o.whale) flashWarn('WHALE DOWN',0x4ADE80);
          else if(o.shark) flashWarn('SHARK DOWN',0x4ADE80);
          continue;
        } else if(o.mass > mass*1.12 && invuln<=0){
          gameOver(o.whale?true:(o.shark?'shark':false));
          return;
        }
        // similar size: bump, no eat
      }
      if(o.mass>mass*1.12 && d<pr+o.size+14) danger=true;
    }
    // danger vignette
    el('warn').style.opacity=danger?'0.5':'0';
    el('warn').textContent='!';

    // best
    if(Math.floor(mass)>best){best=Math.floor(mass);localStorage.setItem('sal_best',best);}
    updHud();
  } else {
    // idle camera drift on menus
    camera.position.x=Math.sin(clock.elapsedTime*0.2)*14;
    camera.position.z=Math.cos(clock.elapsedTime*0.2)*14;
    camera.position.y=4+Math.sin(clock.elapsedTime*0.4)*1.5;
    camera.lookAt(0,0,0);
    player.rotation.y=clock.elapsedTime*0.5;
    player.scale.setScalar(2.2);
  }

  // particles
  for(var p=pooForce.length-1;p>=0;p--){
    var m=pooForce[p]; m.userData.life-=dt; m.position.addScaledVector(m.userData.v,dt); m.userData.v.multiplyScalar(0.92);
    m.scale.multiplyScalar(0.92);
    if(m.userData.life<=0){scene.remove(m);pooForce.splice(p,1);}
  }

  renderer.render(scene,camera);
}

var warnT=0;
function flashWarn(txt,color){
  var w=el('warn'); w.textContent=txt; w.style.color='#'+color.toString(16).padStart(6,'0');
  w.style.opacity='1'; clearTimeout(warnT); warnT=setTimeout(function(){w.style.opacity='0';},700);
}

/* ---------- flow ---------- */
function startGame(){
  mass=1; gameTime=0; yaw=0;pitch=0;targYaw=0;targPitch=0; invuln=0; player.visible=true;
  player.position.set(0,0,0); player.rotation.set(0,0,0); player.scale.setScalar(1);
  clearNpcs(); clearHooks(); clearNets(); for(var i=0;i<MAXN;i++)spawnNpc(true);
  el('start').classList.add('hidden'); el('over').classList.add('hidden'); el('hud').classList.remove('hidden'); el('gnav').classList.remove('hidden');
  updHud(); running=true;
}
function loadLB(){try{return JSON.parse(localStorage.getItem('sal_lb')||'[]');}catch(e){return[];}}
function addScore(sz){var a=loadLB();var e={s:sz,t:(new Date()).getTime()};a.push(e);a.sort(function(x,y){return y.s-x.s;});a=a.slice(0,10);localStorage.setItem('sal_lb',JSON.stringify(a));return e;}
function renderLB(hl,tid){var a=loadLB();var h='<div class="lbtitle">🏆 Top runs (this device)</div>';if(!a.length){h+='<div class="lbrow"><span>No runs yet — go eat.</span></div>';}for(var i=0;i<a.length;i++){var me=(hl&&a[i].t===hl.t)?' me':'';h+='<div class="lbrow'+me+'"><span class="r">'+(i+1)+'</span><span>size</span><span class="s">'+a[i].s+'</span></div>';}var e=el(tid||'lb');if(e)e.innerHTML=h;}
function gameOver(reason){
  running=false; player.visible=true;
  var fs=Math.floor(mass); var lbe=addScore(fs); renderLB(lbe);
  el('finalSize').textContent=fs; el('finalBest').textContent=best;
  var whaled=tierName(mass).indexOf('WHALE')>=0;
  el('overTitle').textContent= whaled?'Absolute Whale':((reason==='hook'||reason==='net')?'Caught!':'Chomped');
  var msg;
  if(whaled) msg='You ate the ocean and became a <b>WHALE</b>. The river bows.';
  else if(reason==='hook') msg='A <b>fishing hook</b> reeled you in. Gone.';
  else if(reason==='net') msg='You drifted too <b>shallow</b> and hit a <b>net</b>. Caught.';
  else if(reason===true) msg='A <b>MONAD whale</b> swallowed you whole.';
  else if(reason==='shark') msg='A <b>shark</b> made you its lunch.';
  else msg='A bigger fish got you. Swim smarter.';
  el('overMsg').innerHTML=msg;
  el('hud').classList.add('hidden'); el('over').classList.remove('hidden');
  el('dashBtn').classList.add('hidden');
}
el('playBtn').onclick=startGame;
el('againBtn').onclick=startGame;
// leaderboard modal (pauses the game while open)
el('lbBtn').onclick=function(){ renderLB(null,'lbBig'); if(running) paused=true; el('lbModal').classList.remove('hidden'); };
el('lbClose').onclick=function(){ el('lbModal').classList.add('hidden'); paused=false; };
el('lbBtn2').onclick=function(){ renderLB(null,'lbBig'); if(running) paused=true; el('lbModal').classList.remove('hidden'); };
el('shareBtn').onclick=function(){
  var t=encodeURIComponent('I grew to size '+Math.floor(mass)+' as $SALMONAD in Shrimp to Whale 🐟🐋\nSwim: '+location.origin+'/game\n@Salmonads');
  window.open('https://twitter.com/intent/tweet?text='+t,'_blank');
};

/* resize */
function resize(){var w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize); resize();
frame();
})();
</script>
